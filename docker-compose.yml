services:
  postgres:
    image: postgres:16-alpine
    container_name: school-saas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: school_saas
      POSTGRES_USER: school_saas
      POSTGRES_PASSWORD: school_saas_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U school_saas -d school_saas"]
      interval: 5s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7-alpine
    container_name: school-saas-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15

volumes:
  postgres_data:
  redis_data:
